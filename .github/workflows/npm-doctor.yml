# Temporary diagnostic. The npm CLI collapses several distinct registry
# rejections into a single "404 ... or you do not have permission", so this runs
# the publish with verbose logging to surface the raw HTTP response body, plus
# the account state that commonly blocks a first publish.
#
# Delete this workflow once the publish succeeds.
name: npm doctor

on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Account state
        continue-on-error: true
        run: |
          echo "--- whoami ---"; npm whoami
          echo "--- profile (2FA, email verification) ---"
          npm profile get 2>&1 | grep -viE "^email|fullname|twitter|github" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Is the name blocked rather than merely absent?
        continue-on-error: true
        run: |
          echo "--- unauthenticated GET on the name ---"
          curl -s -o /tmp/name.json -w "http %{http_code}\n" https://registry.npmjs.org/n8n-nodes-aca
          head -c 400 /tmp/name.json; echo
          echo "--- npm registry search for near-identical names ---"
          curl -s "https://registry.npmjs.org/-/v1/search?text=n8n-nodes-aca&size=5" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{JSON.parse(s).objects.forEach(o=>console.log(' ',o.package.name))}catch(e){console.log('search failed')}})"

      - name: Verbose publish attempt
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm run build
          echo "--- publish with verbose logging ---"
          npm publish --access public --provenance --loglevel verbose 2>&1 | tail -60
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_MODE: 'true'
